<title>Prototype Entités et Dossiers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one desktop window on a neutral canvas — thin title bar, fixed left nav (1 to 6), top bar with back + breadcrumb + global search, every record opens full page. */
:root{
  --canvas:#E4E7EA; --app:#F4F5F6; --surface:#FFFFFF; --raised:#FFFFFF; --subtle:#FAFBFB; --muted:#EBEDEF; --hover:#EBEDEF; --selected:#EEF3FC;
  --fg:#171B20; --fg2:#56606B; --fg3:#6B7480; --fg-dis:#9FA7B1; --on-accent:#FFFFFF;
  --border-s:#EBEDEF; --border:#DEE1E5; --border-x:#C8CDD3; --focus:#3D6BD6;
  --accent:#2B59C3; --accent-h:#2249A3; --accent-t:#2B59C3; --accent-s:#EEF3FC; --accent-b:#BCCFF3;
  --ok-bg:#EAF6EF; --ok-b:#A9D9BC; --ok-t:#17663D; --ok:#1E7F4D;
  --warn-bg:#FDF4E3; --warn-b:#F3CF85; --warn-t:#8A5506; --warn:#A8690A; --warn-chart:#E0A030; --pend-chart:#8A5506;
  --bad-bg:#FCEEEE; --bad-b:#F0B8B8; --bad-t:#A12E2E; --bad:#C03B3B;
  --vol:#3D6BD6; --vol-m:#C8CDD3; --grid:#EBEDEF; --scrim:rgba(15,18,22,.32);
  --shadow:0 6px 16px rgba(15,18,22,.10),0 1px 2px rgba(15,18,22,.06);
  --sans:'Inter',system-ui,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --row:40px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --canvas:#08090B; --app:#0F1216; --surface:#171B20; --raised:#1E2329; --subtle:#1E2329; --muted:#272D35; --hover:#272D35; --selected:#172C5C;
  --fg:#F4F5F6; --fg2:#9FA7B1; --fg3:#8A929C; --fg-dis:#56606B; --on-accent:#0F1216;
  --border-s:#272D35; --border:#3C444E; --border-x:#56606B; --focus:#6E93E3;
  --accent:#6E93E3; --accent-h:#95B2EC; --accent-t:#95B2EC; --accent-s:#172C5C; --accent-b:#2249A3;
  --ok-bg:#0F3A24; --ok-b:#17663D; --ok-t:#A9D9BC; --ok:#4FB37B;
  --warn-bg:#4A2E05; --warn-b:#8A5506; --warn-t:#F3CF85; --warn:#E0A030; --warn-chart:#E0A030; --pend-chart:#F3CF85;
  --bad-bg:#521A1A; --bad-b:#A12E2E; --bad-t:#F0B8B8; --bad:#E07070;
  --vol:#6E93E3; --vol-m:#56606B; --grid:#272D35; --scrim:rgba(0,0,0,.55);
  --shadow:0 6px 16px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3); color-scheme:dark } }
:root[data-theme="dark"]{
  --canvas:#08090B; --app:#0F1216; --surface:#171B20; --raised:#1E2329; --subtle:#1E2329; --muted:#272D35; --hover:#272D35; --selected:#172C5C;
  --fg:#F4F5F6; --fg2:#9FA7B1; --fg3:#8A929C; --fg-dis:#56606B; --on-accent:#0F1216;
  --border-s:#272D35; --border:#3C444E; --border-x:#56606B; --focus:#6E93E3;
  --accent:#6E93E3; --accent-h:#95B2EC; --accent-t:#95B2EC; --accent-s:#172C5C; --accent-b:#2249A3;
  --ok-bg:#0F3A24; --ok-b:#17663D; --ok-t:#A9D9BC; --ok:#4FB37B;
  --warn-bg:#4A2E05; --warn-b:#8A5506; --warn-t:#F3CF85; --warn:#E0A030; --warn-chart:#E0A030; --pend-chart:#F3CF85;
  --bad-bg:#521A1A; --bad-b:#A12E2E; --bad-t:#F0B8B8; --bad:#E07070;
  --vol:#6E93E3; --vol-m:#56606B; --grid:#272D35; --scrim:rgba(0,0,0,.55);
  --shadow:0 6px 16px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3); color-scheme:dark }
:root[data-density="compact"]{ --row:32px }

html,body{height:100%}
*{box-sizing:border-box}
body{background:var(--canvas);color:var(--fg);font:13px/20px var(--sans);padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.ic{flex:none}
.mono{font-family:var(--mono);font-size:12px;font-weight:500}
.num{font-variant-numeric:tabular-nums}

/* window */
.win{height:100%;display:grid;grid-template-rows:32px minmax(0,1fr);background:var(--app);border:1px solid var(--border-x);border-radius:8px;overflow:hidden}
.titlebar{display:flex;align-items:center;gap:8px;padding-left:12px;color:var(--fg2);font-size:12px;font-weight:500}
.titlebar .glyph{width:14px;height:14px;border-radius:4px;background:var(--accent)}
.titlebar .demo{margin-left:8px;color:var(--fg3);font-weight:400}
.titlebar .ctl{margin-left:auto;display:flex}
.titlebar .ctl span{width:46px;height:32px;display:grid;place-items:center}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:0}
.side{display:flex;flex-direction:column;gap:2px;padding:4px 8px 8px;min-height:0}
.side .grow{flex:1}
.side hr{border:0;border-top:1px solid var(--border);margin:6px 0;width:100%}
.nav{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;border-radius:6px;color:var(--fg2);font-weight:500;width:100%}
.nav:hover{background:var(--hover);color:var(--fg)}
.nav[aria-current="page"]{background:var(--selected);color:var(--accent-t)}
.nav .n{margin-left:auto;font:11px var(--mono);color:var(--fg3)}
.main{display:grid;grid-template-rows:48px minmax(0,1fr);background:var(--surface);border-top:1px solid var(--border);border-left:1px solid var(--border);border-top-left-radius:8px;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--border);min-width:0}
.topbar .vr{width:1px;height:16px;background:var(--border);flex:none}
.crumbs{display:flex;align-items:center;gap:2px;min-width:0;flex:1;color:var(--fg2);white-space:nowrap;overflow:hidden}
.crumbs button{padding:2px 4px;border-radius:4px;color:var(--fg2)}
.crumbs button:hover{background:var(--hover);color:var(--fg)}
.crumbs b{padding:2px 4px;font-weight:500;color:var(--fg);overflow:hidden;text-overflow:ellipsis}
.crumbs .ic{color:var(--fg-dis)}
.content{overflow:auto;padding:24px;min-width:0}
.page{display:flex;flex-direction:column;gap:28px;max-width:1280px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 12px;border-radius:6px;font-weight:500;border:1px solid var(--border);background:var(--surface);white-space:nowrap}
.btn:hover{background:var(--hover);border-color:var(--border-x)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-h);border-color:var(--accent-h)}
.btn.ghost{border-color:transparent;background:none;color:var(--fg2)}
.btn.ghost:hover{background:var(--hover);color:var(--fg)}
.btn.lg{height:36px;padding:0 16px}
.btn:disabled{color:var(--fg-dis);background:var(--surface);border-color:var(--border-s);cursor:default}
.field{height:28px;padding:0 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);min-width:0}
.field:hover{border-color:var(--border-x)}
textarea.field{height:auto;padding:6px 8px;resize:vertical;width:100%}
select.field{padding-right:4px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent-s);border-color:var(--accent-b);color:var(--accent-t)}
.chip .box{width:14px;height:14px;border-radius:4px;border:1px solid var(--border-x);display:grid;place-items:center}
.chip[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.seg{display:inline-flex;padding:2px;gap:2px;border-radius:6px;background:var(--muted)}
.seg button{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:4px;color:var(--fg2);font-weight:500;border:1px solid transparent;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);border-color:var(--border);color:var(--fg)}
.kbd{font:11px/16px var(--mono);color:var(--fg2);border:1px solid var(--border);border-radius:4px;padding:0 4px;background:var(--surface);min-width:18px;text-align:center}
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:4px;font-size:12px;font-weight:500;border:1px solid;white-space:nowrap}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.ok{background:var(--ok-bg);border-color:var(--ok-b);color:var(--ok-t)} .badge.ok i{background:var(--ok)}
.badge.warn{background:var(--warn-bg);border-color:var(--warn-b);color:var(--warn-t)} .badge.warn i{background:var(--warn)}
.badge.warn.strong{border-color:var(--warn)}
.badge.bad{background:var(--bad-bg);border-color:var(--bad-b);color:var(--bad-t)} .badge.bad i{background:var(--bad)}
.badge.plain{background:var(--surface);border-color:var(--border);color:var(--fg)} .badge.plain i{background:var(--fg3)}
.badge.mute{background:var(--muted);border-color:var(--border);color:var(--fg2)} .badge.mute i{background:none;border:1.5px solid var(--fg3)}
.count{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 6px;border-radius:999px;background:var(--muted);color:var(--fg2);font-size:12px;font-weight:500}

/* search */
.search{position:relative;width:360px;flex:0 1 360px;min-width:120px}
.search label{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border:1px solid var(--border);border-radius:6px;background:var(--subtle);color:var(--fg2)}
.search label:focus-within{background:var(--surface);border-color:var(--focus);box-shadow:0 0 0 1px var(--focus)}
.search input{border:0;background:none;outline:0;flex:1;min-width:0}
.search input::placeholder{color:var(--fg3)}
.dd{position:absolute;right:0;top:calc(100% + 4px);width:min(480px,calc(100vw - 48px));background:var(--raised);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);overflow:hidden;z-index:20}
.dd .info{padding:8px 12px;border-bottom:1px solid var(--border-s);color:var(--fg3);font-size:12px}
.dd h4{margin:0;padding:8px 12px 4px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--fg3);font-weight:600}
.dd .res{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 12px;color:var(--fg2)}
.dd .res b{font-weight:500;color:var(--fg)} .dd .res mark{background:none;color:var(--accent-t);font-weight:600}
.dd .res .sp{flex:1}
.dd .res.on{background:var(--selected)} .dd .res.on .ic{color:var(--accent-t)}
.dd .grp+.grp{border-top:1px solid var(--border-s)}
.dd .foot{display:flex;gap:16px;align-items:center;padding:8px 12px;background:var(--subtle);border-top:1px solid var(--border);color:var(--fg2);font-size:12px;flex-wrap:wrap}
.dd .foot span{display:inline-flex;gap:4px;align-items:center}

/* page + sections */
.ph{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.eyebrow{margin:0 0 2px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--accent-t)}
h1{margin:0;font-size:22px;line-height:28px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.lead{margin:2px 0 0;color:var(--fg2);max-width:70ch}
.ph-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:relative}
.sec{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-h{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--border)}
.sec-h h2{margin:0;font-size:15px;line-height:20px;font-weight:600;display:flex;gap:8px;align-items:baseline}
.sec-h h2 span{font:500 12px var(--mono);color:var(--fg3)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.empty{padding:24px;border:1px dashed var(--border-x);border-radius:8px;color:var(--fg2);text-align:center;background:var(--subtle)}

/* kpi + charts */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{display:flex;flex-direction:column;gap:4px;padding:16px;border:1px solid var(--border);border-radius:8px;background:var(--surface);width:100%}
.kpi:hover{border-color:var(--border-x)}
.kpi small{font-size:12px;font-weight:500;color:var(--fg2);display:flex;justify-content:space-between;gap:8px}
.kpi strong{font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.01em}
.kpi em{font-style:normal;font-size:12px;color:var(--fg3)}
.kpi.att strong{color:var(--bad-t)} .kpi.att small .ic{color:var(--bad)}
.card{padding:16px;border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;gap:16px;min-width:0}
.card h3{margin:0;font-size:14px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.card h3 span{font-size:12px;font-weight:400;color:var(--fg3)}
.stack{display:flex;gap:2px;height:12px;border-radius:3px;overflow:hidden}
.legend{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:8px;color:var(--fg2)}
.legend li i{width:8px;height:8px;border-radius:2px}
.legend li b{margin-left:auto;color:var(--fg);font-weight:500}
.legend li span{width:40px;text-align:right;font-size:12px;color:var(--fg3)}
.bars{display:grid;grid-template-columns:24px 1fr;gap:8px}
.bars .y{display:flex;flex-direction:column;justify-content:space-between;height:156px;font-size:12px;color:var(--fg3);text-align:right}
.bars .plot{display:flex;align-items:flex-end;gap:12px;height:140px;margin-top:8px;padding:0 8px;border-bottom:1px solid var(--border-x);
  background:repeating-linear-gradient(to bottom,var(--grid) 0 1px,transparent 1px 46.66px)}
.bars .plot i{flex:1;border-radius:2px 2px 0 0;background:var(--vol)} .bars .plot i.m{background:var(--vol-m)}
.bars .x{grid-column:2;display:flex;gap:12px;padding:0 8px;font-size:12px;color:var(--fg3)} .bars .x span{flex:1;text-align:center}

/* filter bar + table */
.fbar{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--border);border-radius:8px;flex-wrap:wrap}
.fbar>.ic{color:var(--fg-dis)} .fbar .vr{width:1px;height:16px;background:var(--border)} .fbar .sp{flex:1}
.fbar label{display:inline-flex;align-items:center;gap:6px;color:var(--fg2)} .fbar .cnt{font-size:12px;color:var(--fg3)}
.tbl-wrap{border:1px solid var(--border);border-radius:8px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th{height:32px;padding:0 12px;text-align:left;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--fg3);background:var(--subtle);border-bottom:1px solid var(--border);white-space:nowrap}
td{height:var(--row);padding:0 12px;border-bottom:1px solid var(--border-s);color:var(--fg2);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer} tbody tr:hover td{background:var(--hover)}
td.name{color:var(--fg);font-weight:500} td.name span{display:inline-flex;align-items:center;gap:8px}
tr.arch td.name{color:var(--fg2)} td.go{width:40px;color:var(--fg-dis);text-align:center}

/* record page */
.recap{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:16px;border:1px solid var(--border);border-radius:8px}
.recap .tile{width:48px;height:48px;border-radius:8px;background:var(--accent-s);color:var(--accent-t);display:grid;place-items:center;flex:none}
.recap dl{display:flex;gap:24px;margin:0;flex-wrap:wrap;flex:1} .recap dt{font-size:12px;color:var(--fg3)} .recap dd{margin:0;font-weight:500;display:flex;align-items:center;gap:8px}
.alert{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid;border-radius:6px;flex-wrap:wrap}
.alert div{flex:1;min-width:200px} .alert b{display:block;font-weight:500} .alert p{margin:0;font-size:12px;color:var(--fg2)}
.alert.warn{background:var(--warn-bg);border-color:var(--warn-b)} .alert.warn b,.alert.warn>.ic{color:var(--warn-t)}
.alert.bad{background:var(--bad-bg);border-color:var(--bad-b)} .alert.bad b,.alert.bad>.ic{color:var(--bad-t)}
.alert.info{background:var(--subtle);border-color:var(--border)} .alert.info>.ic{color:var(--fg2)}
.alert form{display:flex;gap:8px;align-items:center}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto}
.tabs button{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;color:var(--fg2);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--fg);border-bottom-color:var(--border-x)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs button[aria-selected="true"] .count{background:var(--accent-s);color:var(--accent-t)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:16px 1fr auto;gap:0 12px;padding-bottom:16px;position:relative}
.tl li::before{content:"";position:absolute;left:7.5px;top:18px;bottom:0;width:1px;background:var(--border)}
.tl li:last-child::before{display:none}
.tl li i{width:8px;height:8px;border-radius:50%;margin:6px 4px 0;background:var(--surface);border:1.5px solid var(--border-x)}
.tl li.assoc i{background:var(--accent);border-color:var(--accent)} .tl li.clos i{background:var(--ok);border-color:var(--ok)} .tl li.alerte i{background:var(--warn);border-color:var(--warn)}
.tl b{font-weight:500} .tl p{margin:0;grid-column:2;font-size:12px;color:var(--fg2)} .tl time{font-size:12px;color:var(--fg3)}
.tl-year{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--fg3);margin:0 0 8px}

/* big folders + files */
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:16px}
.folder{display:flex;flex-direction:column;gap:12px;padding:16px;border:1px solid var(--border);border-radius:8px;background:var(--surface);min-height:148px;width:100%}
.folder:hover{border-color:var(--accent-b);background:var(--subtle)}
.folder .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.folder .fic{width:56px;height:56px;border-radius:8px;background:var(--accent-s);color:var(--accent-t);display:grid;place-items:center}
.folder b{font-size:16px;line-height:22px;font-weight:600;display:block}
.folder small{font-size:12px;color:var(--fg2);display:block}
.folder .ft{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--fg3)}
.folder.sub{min-height:112px} .folder.sub .fic{width:48px;height:48px}
.split .folders{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.folder.add{border-style:dashed;border-color:var(--border-x);background:var(--subtle);align-items:center;justify-content:center;text-align:center;gap:6px;min-height:112px}
.folder.add .plus{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin-bottom:4px}
.folder.add:hover{border-color:var(--accent);background:var(--accent-s)}
/* named options to tick */
.checks{display:flex;flex-direction:column;gap:8px}
.ckrow{display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-weight:500}
.ckrow input,.ck input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0}
.ckrow span{flex:1} .ckrow em{font-style:normal;font-size:12px;color:var(--fg3)} .ckrow em.on{color:var(--ok-t)}
.ckrow:has(input:checked){background:var(--ok-bg);border-color:var(--ok-b)}
.ck{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer;color:var(--fg)}
.inline{display:flex;gap:8px;flex-wrap:wrap} .inline .field{flex:1;height:32px;min-width:160px} .inline .btn{height:32px}
/* document: date top right, fillable fields */
.p-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.p-date{display:grid;gap:2px;font-size:12px;color:var(--fg3);text-align:right;justify-items:end}

const codeOf = x => x.code ? `<span class="mono">Code #${x.code}</span>` : badge('noid');
const head = (num, title, desc, actions = '') => `<header class="ph"><div><p class="eyebrow">${num}</p><h1>${title}</h1><p class="lead">${desc}</p></div><div class="ph-actions">${actions}</div></header>`;
const sec = (num, title, body, extra = '') => `<section class="sec"><div class="sec-h"><h2><span>${num}</span>${title}</h2>${extra}</div>${body}</section>`;
const opt = (v, l, cur) => `<option value="${esc(v)}"${String(cur) === String(v) ? ' selected' : ''}>${esc(l)}</option>`;
const sel = (id, path, cur, opts) => `<select class="field" id="${id}" data-f="${path}">${opts.map(o => Array.isArray(o) ? opt(o[0], o[1], cur) : opt(o, o, cur)).join('')}</select>`;
const plural = (n, w) => `${n} ${w}${n > 1 ? 's' : ''}`;
const folder = d => { const ok = d.checks.filter(c => c.ok).length; return `<button class="folder" data-go="dossier|${d.id}|"><span class="top"><span class="fic">${ic('dossier', 32)}</span>${badge(d.statut)}</span>
  <span><b>${esc(d.nom)}</b><small>${esc(d.theme)} · Année ${d.annee}</small></span>
  <span class="ft"><span>${plural(nFiles(d), 'fichier')} · ${plural(d.sous.length, 'dossier')}${d.checks.length ? ` · ${ok}/${d.checks.length} cochées` : ''}</span>${ic('right', 16)}</span></button>`; };
const timeline = ev => ev.length ? `<ol class="tl">${ev.map(e => `<li class="${e.c}"><i></i><b>${esc(e.t)}</b><time>Année ${e.y}</time><p>${esc(e.d)}</p></li>`).join('')}</ol>` : `<p class="empty">Aucun événement pour cette fiche.</p>`;
const table = (heads, rows) => rows.length ? `<div class="tbl-wrap"><table><thead><tr>${heads.map(h => `<th>${h}</th>`).join('')}<th></th></tr></thead><tbody>${rows.join('')}</tbody></table></div>` : `<p class="empty">Aucun résultat avec ces filtres.</p>`;
const entRow = (k, x) => `<tr class="${x.actif ? '' : 'arch'}" data-go="fiche-${k}|${x.id}" tabindex="0"><td class="name"><span>${ic(k)}${esc(x.nom)}</span></td><td>${codeOf(x)}</td><td>${esc(x.cat)}</td><td>${badge(x.actif ? 'actif' : 'archive')}</td><td>Année ${x.annee}</td><td class="go">${ic('right', 14)}</td></tr>`;
const magOpts = cur => MAGASIN.filter(m => m.actif || m.nom === cur).map(m => opt(m.nom, m.nom, cur)).join('');

/* A document: date top right (automatic, editable), then the model's blocks, fillable in place. */
const paper = (f, d) => {
  const a = byId(A, d.a), b = byId(B, d.b);
  const V = { 'Entité A · Nom': a.nom, 'Entité A · Code': a.code ? 'Code #' + a.code : 'Sans identifiant', 'Entité B · Nom': b.nom, 'Entité B · Code unique': b.code ? 'Code #' + b.code : 'Sans identifiant', 'Date du jour': fmt(f.date) };
  const blk = (x, i) => x.t === 'texte' ? `<p>${esc(x.v)}</p>` :
    x.t === 'champ' ? `<label class="df" for="db-${i}">${esc(x.v)}<input class="field" id="db-${i}" data-db="${i}" value="${esc(x.val || '')}" placeholder="À remplir"></label>` :
    x.t === 'variable' ? `<p class="pv-var"><small>${esc(x.v)}</small>${esc(V[x.v])}</p>` :
    x.t === 'case' ? `<label class="ck" for="db-${i}"><input type="checkbox" id="db-${i}" data-db="${i}" ${x.ok ? 'checked' : ''}><span>${esc(x.v)}</span></label>` :
    x.t === 'magasin' ? `<label class="df" for="db-${i}">${esc(x.v)}<select class="field" id="db-${i}" data-db="${i}"><option value="">Choisir dans le Magasin…</option>${magOpts(x.val)}</select></label>` :
    `<table><tr><th>Colonne 1</th><th>Colonne 2</th><th>Colonne 3</th></tr><tr><td>—</td><td>—</td><td>—</td></tr></table>`;
  return `<div class="paper"><div class="p-top"><div><h4>${esc(f.nom)}</h4><p>${esc(d.nom)} · ${esc(d.theme)}</p></div>
    <label class="p-date" for="doc-date">Date du document<input class="field" type="date" id="doc-date" data-doc="date" value="${esc(f.date)}"></label></div>
    ${f.blocs ? f.blocs.map(blk).join('') : `<span class="ln"></span><span class="ln"></span><span class="ln s"></span><p>Fichier importé : son contenu numérisé s’affiche ici.</p><span class="ln"></span><span class="ln s"></span>`}</div>`;
};

/* ---------- pages ---------- */
const P = {};
P.dashboard = () => {
  const open = D.filter(d => d.statut !== 'clos'), noA = A.filter(x => !x.code), noB = B.filter(x => !x.code);
  const kpi = (l, v, d, to, alert) => `<button class="kpi${alert ? ' att' : ''}" data-nav="${to}"><small>${l}${alert ? ic('alerte', 14) : ''}</small><strong class="num">${v}</strong><em>${d}</em></button>`;
  const dist = [['clos', 'Clôturés', 'var(--ok)'], ['cours', 'En cours', 'var(--warn-chart)'], ['piece', 'En attente de pièce finale', 'var(--pend-chart)']].map(([k, l, c]) => [l, c, D.filter(d => d.statut === k).length]);
  const inv = S.inv === 'a' ? noA : noB;
  return head('Module 1', 'Tableau de bord', 'Pilotage global : compteurs, graphiques, inventaire à compléter et dossiers en cours.') +
  sec('1.1', 'Compteurs', `<div class="kpis">
    ${kpi('Entités A actives', A.filter(x => x.actif).length, `sur ${A.length} fiches`, 'rep-a')}
    ${kpi('Entités B actives', B.filter(x => x.actif).length, `sur ${B.length} fiches`, 'rep-b')}
    ${kpi('Dossiers ouverts', open.length, `dont ${open.filter(d => d.statut === 'piece').length} en attente de pièce finale`, 'dossiers')}
    ${kpi('Fiches sans identifiant', noA.length + noB.length, `${noA.length} Entités A · ${noB.length} Entités B`, 'rep-a', true)}</div>`) +
  sec('1.2', 'Graphiques', `<div class="cols">
    <div class="card"><h3>Répartition des dossiers par état<span>${D.length} dossiers</span></h3>
      <div class="stack">${dist.map(([l, c, n]) => `<i style="flex:${n};background:${c}" title="${l} : ${n}"></i>`).join('')}</div>
      <ul class="legend">${dist.map(([l, c, n]) => `<li><i style="background:${c}"></i>${l}<b class="num">${n}</b><span class="num">${Math.round(n / D.length * 100)} %</span></li>`).join('')}</ul></div>
    <div class="card"><h3>Volume traité par période<span>Année 2025</span></h3>
      <div class="bars"><div class="y"><span>30</span><span>20</span><span>10</span><span>0</span></div>
      <div class="plot">${VOLUME.map((v, i) => `<i class="${i === VOLUME.length - 1 ? 'm' : ''}" style="height:${v / 30 * 100}%" title="P${i + 1} : ${v}"></i>`).join('')}</div>
      <div class="x">${VOLUME.map((_, i) => `<span>P${i + 1}</span>`).join('')}</div></div>
      <ul class="legend" style="grid-auto-flow:column;justify-content:start;gap:16px"><li><i style="background:var(--vol)"></i>Période terminée</li><li><i style="background:var(--vol-m)"></i>Période en cours</li></ul></div></div>`) +
  `<div class="cols">` +
  sec('1.3', 'Inventaire à compléter', (inv.length ? `<div class="files">${inv.map(x => `<button class="file" data-go="fiche-${S.inv}|${x.id}|code"><span class="fic">${ic(S.inv, 20)}</span><span><b>${esc(x.nom)}</b><small>${esc(x.cat)}</small></span><span class="sp"></span>${badge('noid')}<span class="btn">Saisir le code</span></button>`).join('')}</div>` : `<p class="empty">Toutes les fiches ont un identifiant.</p>`),
    `<div class="seg"><button data-act="inv|a" aria-pressed="${S.inv === 'a'}">Entités A sans code <span class="count">${noA.length}</span></button><button data-act="inv|b" aria-pressed="${S.inv === 'b'}">Entités B sans code <span class="count">${noB.length}</span></button></div>`) +
  sec('1.4', 'Dossiers en cours', open.length ? `<div class="files">${open.map(d => `<button class="file" data-go="dossier|${d.id}|"><span class="fic">${ic('dossier', 20)}</span><span><b>${esc(d.nom)}</b><small>${esc(d.theme)} · Année ${d.annee}</small></span><span class="sp"></span>${badge(d.statut)}${ic('right')}</button>`).join('')}</div>` : `<p class="empty">Aucun dossier en cours.</p>`) + `</div>`;
};

const rep = k => {
  const L = list(k), f = S.f[k], n = k === 'a' ? 2 : 3, K = k.toUpperCase(), catL = k === 'a' ? 'Groupe' : 'Type';
  const digits = f.code.replace(/\D/g, '');
  let rows = L.filter(x => (f.statut === 'tous' || (f.statut === 'actif') === x.actif) && (f.cat === 'tous' || x.cat === f.cat) && (!f.noid || !x.code) && (!digits || (x.code || '').includes(digits)));
  rows.sort((p, q) => f.sort === 'code' ? (p.code || '~').localeCompare(q.code || '~') : p.nom.localeCompare(q.nom));
  const cats = [...new Set(L.map(x => x.cat))].sort();
  return head(`Module ${n}`, `Répertoire ${K}`, `Toutes les Entités ${K}. Un clic sur une ligne ouvre la fiche en pleine page.`, `<button class="btn primary" data-go="form-${k}">${ic('plus', 14)}Créer une Entité ${K}</button>`) +
  sec(`${n}.1`, 'Filtres et tri', `<div class="fbar">${ic('filtre')}
    <label>Statut ${sel(`f-${k}-statut`, `${k}.statut`, f.statut, [['tous', 'Tous'], ['actif', 'Actif'], ['archive', 'Archivé']])}</label>
    <label>${catL} ${sel(`f-${k}-cat`, `${k}.cat`, f.cat, [['tous', 'Tous'], ...cats])}</label>
    <button class="chip" data-act="noid|${k}" aria-pressed="${f.noid}"><span class="box">${f.noid ? ic('check', 10) : ''}</span>Sans identifiant</button>
    <span class="vr"></span><label>Trier par ${sel(`f-${k}-sort`, `${k}.sort`, f.sort, [['nom', 'Nom'], ['code', 'Code']])}</label>
    <span class="sp"></span><span class="cnt num">${plural(rows.length, 'fiche')}</span>
    ${k === 'b' ? `<input class="field mono" id="f-b-code" data-f="b.code" value="${esc(f.code)}" placeholder="Code unique…" aria-label="Recherche par code unique" style="width:140px">` : ''}</div>`) +
  sec(`${n}.2`, `Liste des Entités ${K}`, table(['Nom', 'Code unique', catL, 'Statut', 'Mise à jour'], rows.map(x => entRow(k, x))));
};
P['rep-a'] = () => rep('a'); P['rep-b'] = () => rep('b');

const fiche = k => {
  const x = byId(list(k), S.route.id), n = k === 'a' ? 2 : 3, K = k.toUpperCase(), o = k === 'a' ? 'b' : 'a';
  const linked = LINKS.filter(l => l[k === 'a' ? 0 : 1] === x.id).map(l => byId(list(o), l[k === 'a' ? 1 : 0]));
  const dos = D.filter(d => d[k] === x.id);
  const assoc = linked.map(y => ({ c: 'assoc', t: `Association avec ${y.nom}`, d: y.code ? `Code #${y.code} rattaché à cette fiche.` : 'Fiche sans identifiant rattachée à cette fiche.', y: y.annee }));
  const ops = dos.map(d => ({ c: d.statut === 'clos' ? 'clos' : d.statut === 'piece' ? 'alerte' : '', t: d.statut === 'clos' ? `${d.nom} clôturé` : d.statut === 'piece' ? `Pièce finale manquante` : `${d.nom} ouvert`, d: d.statut === 'piece' ? `${d.nom} en attente de sa pièce finale.` : `${d.theme}.`, y: d.annee }));
  const created = { c: '', t: 'Fiche créée', d: `Création de la fiche ${x.nom}.`, y: x.annee };
  const tabs = k === 'a' ? [['Éléments B associés', linked.length], ['Dossiers liés', dos.length], ['Journal chronologique'], ['Historique complet']] : [['Historique des associations', linked.length], ['Journal des opérations'], ['Documents liés', dos.reduce((s, d) => s + nFiles(d), 0)]];
  const t = S.tab;
  let body;
  if (k === 'a') body = [
    table(['Nom', 'Code unique', 'Type', 'Statut', 'Mise à jour'], linked.map(y => entRow('b', y))),
    dos.length ? `<div class="folders">${dos.map(folder).join('')}</div>` : `<p class="empty">Aucun dossier lié.</p>`,
    timeline([...ops, ...assoc]), timeline([...ops, ...assoc, created])][t];
  else body = [
    timeline(assoc), timeline([...ops, created]),
    dos.length ? `<div class="files">${dos.flatMap(d => allFiles(d).map(f => `<button class="file" data-go="dossier|${d.id}|"><span class="fic">${ic('fichier', 20)}</span><span><b>${esc(f.nom)}</b><small>${esc(d.nom)} · ${esc(f.src)}</small></span><span class="sp"></span>${ic('right')}</button>`)).join('')}</div>` : `<p class="empty">Aucun document lié.</p>`][t];
  return head(`Module ${n} · Fiche`, esc(x.nom), `Fiche profil ${K} affichée en pleine page.`, `<button class="btn" data-act="arch|${k}|${x.id}">${x.actif ? 'Archiver la fiche' : 'Réactiver la fiche'}</button>`) +
  sec(`${n}.3`, 'En-tête récapitulatif', `<div class="recap"><span class="tile">${ic(k, 24)}</span><dl>
      <div><dt>Code unique</dt><dd>${codeOf(x)}</dd></div><div><dt>${k === 'a' ? 'Groupe' : 'Type'}</dt><dd>${esc(x.cat)}</dd></div>
      <div><dt>Statut</dt><dd>${badge(x.actif ? 'actif' : 'archive')}</dd></div><div><dt>Mise à jour</dt><dd>Année ${x.annee}</dd></div></dl></div>
    ${!x.code ? `<div class="alert bad">${ic('alerte')}<div><b>Identifiant manquant</b><p>Cette fiche n’a pas encore de code unique. Saisissez 4 chiffres.</p></div>
      <form data-form="code|${k}|${x.id}"><input class="field mono" id="code-input" inputmode="numeric" maxlength="4" placeholder="0000" aria-label="Code unique" style="width:80px"><button class="btn primary">Enregistrer le code</button></form></div>` : ''}
    ${!x.actif ? `<div class="alert info">${ic('info')}<div><b>Fiche archivée</b><p>Cette fiche est conservée et reste consultable. Rien n’est supprimé.</p></div></div>` : ''}`) +
  sec(`${n}.4`, 'Onglets de la fiche', `<div class="tabs" role="tablist">${tabs.map(([l, c], i) => `<button role="tab" aria-selected="${i === t}" data-act="tab|${i}">${l}${c != null ? `<span class="count">${c}</span>` : ''}</button>`).join('')}</div>${body}`);
};
P['fiche-a'] = () => fiche('a'); P['fiche-b'] = () => fiche('b');

const treeNode = (d, n, path, lvl) => {
  const key = d.id + ':' + path, o = S.open.has(key), sub = i => path ? path + '.' + i : String(i);
  return `<div class="trow" style="margin-left:${lvl * 36}px"><button class="tg" data-act="tog|${key}" aria-label="${o ? 'Replier' : 'Déplier'} ${esc(n.nom)}" aria-expanded="${o}">${ic(o ? 'down' : 'right', 20)}</button>
    <button class="open" data-go="dossier|${d.id}|${path}">${ic(o ? 'ouvert' : 'dossier', lvl ? 24 : 28)}<span><b>${esc(n.nom)}</b><br><small>${lvl ? '' : `${esc(d.theme)} · Année ${d.annee} · `}${plural(nFiles(n), 'fichier')}</small></span><span class="sp"></span>${lvl ? '' : badge(d.statut)}</button></div>` +
    (o ? n.sous.map((s, i) => treeNode(d, s, sub(i), lvl + 1)).join('') + n.files.map(f => `<div class="trow f" style="margin-left:${(lvl + 1) * 36 + 40}px"><button class="open" data-go="dossier|${d.id}|${path}|${esc(f.nom)}">${ic('fichier', 22)}<span><b>${esc(f.nom)}</b><br><small>${esc(f.src)}</small></span></button></div>`).join('') : '');
};
P.dossiers = () => {
  const f = S.f.d;
  const rows = D.filter(d => (f.annee === 'tous' || String(d.annee) === f.annee) && (f.theme === 'tous' || d.theme === f.theme) && (f.statut === 'tous' || d.statut === f.statut));
  const years = [...new Set(D.map(d => d.annee))].sort(), themes = [...new Set(D.map(d => d.theme))].sort();
  const SL = { cours: 'En cours', piece: 'Pièce manquante', clos: 'Clôturé' };
  let body;
  if (!rows.length) body = `<p class="empty">Aucun dossier avec ces filtres.</p>`;
  else if (f.view === 'groupes') {
    const key = d => f.group === 'theme' ? d.theme : f.group === 'annee' ? 'Année ' + d.annee : f.group === 'statut' ? SL[d.statut] : 'Tous les dossiers';
    body = [...new Set(rows.map(key))].sort().map(g => { const it = rows.filter(d => key(d) === g); return `<p class="group-h">${esc(g)} <span class="count">${it.length}</span></p><div class="folders">${it.map(folder).join('')}</div>`; }).join('');
  } else body = `<div class="tree">${rows.map(d => treeNode(d, d, '', 0)).join('')}</div>`;
  return head('Module 4', 'Dossiers & Archives', 'Tous les dossiers. Filtrez, regroupez, puis ouvrez un dossier en pleine page.') +
  sec('4.1', 'Filtres et classement', `<div class="fbar">${ic('filtre')}
    <label>Année ${sel('f-d-annee', 'd.annee', f.annee, [['tous', 'Toutes'], ...years])}</label>
    <label>Thème ${sel('f-d-theme', 'd.theme', f.theme, [['tous', 'Tous'], ...themes])}</label>
    <label>Statut ${sel('f-d-statut', 'd.statut', f.statut, [['tous', 'Tous'], ['cours', 'En cours'], ['piece', 'Pièce manquante'], ['clos', 'Clôturé']])}</label>
    <span class="vr"></span><label>Regrouper par ${sel('f-d-group', 'd.group', f.group, [['theme', 'Thème'], ['annee', 'Année'], ['statut', 'Statut'], ['aucun', 'Aucun']])}</label>
    <span class="sp"></span><span class="cnt num">${plural(rows.length, 'dossier')}</span>
    <div class="seg"><button data-act="view|groupes" aria-pressed="${f.view === 'groupes'}">${ic('liste', 14)}Groupes</button><button data-act="view|arbo" aria-pressed="${f.view === 'arbo'}">${ic('arbo', 14)}Arborescence</button></div></div>`) +
  sec('4.2', f.view === 'groupes' ? 'Dossiers regroupés' : 'Arborescence des dossiers', body);
};

P.dossier = () => {
  const r = S.route, d = byId(D, r.id), n = node(d, r.path), isRoot = !r.path, cur = curFile(), sub = i => r.path ? r.path + '.' + i : String(i);
  const state = d.statut === 'clos' ? `<button class="btn" data-act="reopen|${d.id}">Rouvrir le dossier</button>` : `<button class="btn" data-act="clore|${d.id}" ${d.statut === 'piece' ? 'disabled title="Ajoutez d’abord la pièce finale"' : ''}>Clôturer le dossier</button>`;
  const okN = d.checks.filter(c => c.ok).length;
  return head('Module 4 · Dossier ouvert', esc(n.nom), `${esc(d.theme)} · Année ${d.annee}${isRoot ? '' : ' · dans ' + esc(d.nom)}`, `${badge(d.statut)}${state}`) +
  (d.statut === 'piece' ? `<div class="alert warn">${ic('alerte')}<div><b>Pièce finale manquante</b><p>Ce dossier ne peut pas être clôturé tant que la pièce finale n’est pas ajoutée.</p></div><button class="btn" data-act="final">Ajouter la pièce finale</button></div>` : '') +
  `<div class="split"><div style="display:grid;gap:28px">` +
  sec('4.3', 'Contenu du dossier', `<div class="folders">
      <button class="folder add" data-act="add"><span class="plus">${ic('plus', 36)}</span><b>Ajouter</b><small>Un dossier ou un fichier</small></button>
      ${n.sous.map((s, i) => `<button class="folder sub" data-go="dossier|${d.id}|${sub(i)}"><span class="top"><span class="fic">${ic('dossier', 28)}</span></span><span><b>${esc(s.nom)}</b><small>${plural(nFiles(s), 'fichier')}${s.sous.length ? ' · ' + plural(s.sous.length, 'dossier') : ''}</small></span></button>`).join('')}</div>
    ${n.files.length ? `<div class="files">${n.files.map(f => `<button class="file" data-act="pick|${esc(f.nom)}" aria-pressed="${cur && f.nom === cur.nom}"><span class="fic">${ic('fichier', 22)}</span><span><b>${esc(f.nom)}</b><small>${esc(f.src)} · ${fmt(f.date)}</small></span><span class="sp"></span>${ic('right')}</button>`).join('')}</div>` : `<p class="empty">Aucun fichier ici pour l’instant. Cliquez sur le grand « + » pour en ajouter un.</p>`}`,
    `<span class="cnt">${plural(n.sous.length, 'dossier')} · ${plural(n.files.length, 'fichier')}</span>`) +
  (isRoot ? sec('4.4', 'Options à cocher', `<div class="checks">${d.checks.map((c, i) => `<label class="ckrow" for="ck-${i}"><input type="checkbox" id="ck-${i}" data-check="${i}" ${c.ok ? 'checked' : ''}><span>${esc(c.nom)}</span><em class="${c.ok ? 'on' : ''}">${c.ok ? 'Coché' : 'Non coché'}</em></label>`).join('') || `<p class="empty">Aucune option pour ce dossier.</p>`}
      <form data-form="check" class="inline"><input class="field" id="ck-new" placeholder="Nom de la nouvelle option" aria-label="Nom de la nouvelle option" required><button class="btn">Ajouter l’option</button></form></div>`,
    `<span class="cnt">${okN} sur ${d.checks.length} cochées</span>`) : '') +
  `</div>` + sec(isRoot ? '4.5' : '4.4', 'Document', cur ? `<div class="preview"><div class="pv-h">${ic('fichier', 20)}<span><b>${esc(cur.nom)}</b><small>${esc(cur.src)}</small></span></div><div class="pv-b">${paper(cur, d)}</div></div>` : `<p class="empty">Sélectionnez ou ajoutez un fichier pour l’afficher ici.</p>`) + `</div>`;
};

P.creation = () => head('Module 5', 'Création', 'Créer une fiche, gérer les modèles de document ou tenir le Magasin de mots-clés. Chaque entrée s’ouvre en pleine page.') +
  sec('5.1', 'Que voulez-vous créer ?', `<div class="hub">${[['form-a', 'a', 'Créer une Entité A', 'Formulaire structuré, ouvert en pleine page.', 'Ouvrir le formulaire'], ['form-b', 'b', 'Créer une Entité B', 'Formulaire structuré avec champ de code unique.', 'Ouvrir le formulaire'], ['studio', 'fichier', 'Modèles de document', 'Créer, nommer, dupliquer et archiver des modèles.', 'Ouvrir le Studio de Modèles'], ['magasin', 'magasin', 'Magasin', 'Mots-clés à choisir quand vous remplissez un fichier.', 'Ouvrir le Magasin']]

const BL = { texte: 'Texte', champ: 'Champ éditable', tableau: 'Tableau simple', variable: 'Variable automatique', case: 'Case à cocher', magasin: 'Choix du Magasin' };

    hint('Tableau de 3 colonnes, lignes ajoutées quand vous remplissez le document.')}</div></div>`;
  const pv = b => b.t === 'texte' ? `<p>${esc(b.v)}</p>` : b.t === 'champ' ? `<div class="df">${esc(b.v)}<span class="blank"></span></div>` :
    b.t === 'variable' ? `<p><span class="var">${ic('variable', 12)}${esc(b.v)}</span> → ${esc(SAMPLE[b.v])}</p>` :

    b.t === 'magasin' ? `<div class="df">${esc(b.v)}<select class="field" disabled aria-label="${esc(b.v)}"><option>Choisir dans le Magasin…</option></select></div>` :
    `<table><tr><th>Colonne 1</th><th>Colonne 2</th><th>Colonne 3</th></tr><tr><td>—</td><td>—</td><td>—</td></tr></table>`;

  sec('5.4', 'Modèles', `<div class="mlist">${MODELS.map(x => `<button class="mitem" data-act="model|${x.id}" aria-pressed="${x.id === m.id}"><b>${esc(x.nom)}</b><small>${esc(x.theme)}<span>${x.actif ? 'Actif' : 'Archivé'}</span></small></button>`).join('')}
    <button class="btn" data-act="newmodel">${ic('plus', 14)}Nouveau modèle</button></div>`) +
  sec('5.5', 'Éditeur par blocs', `<div class="form" style="max-width:none;grid-template-columns:1fr 160px"><label for="m-nom">Nom du modèle<input class="field" id="m-nom" data-m="nom" value="${esc(m.nom)}"></label>
      <label for="m-theme">Thème<select class="field" id="m-theme" data-m="theme">${THEMES.map(t => opt(t.nom, t.nom, m.theme)).join('')}</select></label></div>

    <div class="acts" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="dup|${m.id}">Dupliquer</button><button class="btn" data-act="archmodel|${m.id}">${m.actif ? 'Archiver' : 'Réactiver'}</button><button class="btn ghost" data-go="magasin">Gérer le Magasin</button></div>`) +
  sec('5.6', 'Aperçu direct', `<div class="preview" style="position:static"><div class="pv-b"><div class="paper"><div class="p-top"><h4>${esc(m.nom)}</h4><span class="p-date">Date du document<span class="field ro">${fmt(today())}</span></span></div>
    <p>La date est ajoutée automatiquement et reste modifiable dans chaque document.</p>${m.blocs.map(pv).join('')}</div></div></div>`) + `</div>`;
};

P.magasin = () => head('Module 5 · Magasin', 'Magasin', 'Les mots-clés du Magasin sont proposés dans les champs « Choix du Magasin » quand vous remplissez un fichier.') +

  sec('6.3', 'Informations système', `<div class="set"><div class="line"><span>Version de l’application</span><b class="mono">0.0.0</b></div><div class="line"><span>Moteur d’affichage</span><b class="mono">WebView</b></div><div class="line"><span>Fenêtre minimale</span><b class="mono">1280 × 720</b></div></div>`);
};

/* ---------- shell rendering ---------- */
function crumbs() {
  const r = S.route, c = [[NAV[MODULE[r.name]][1], NAV[MODULE[r.name]][0]]];
  if (r.name.startsWith('fiche-')) c.push([byId(list(r.name.slice(-1)), r.id).nom]);
  if (r.name === 'dossier') { const d = byId(D, r.id), parts = r.path ? r.path.split('.') : []; c.push([d.nom, `dossier|${d.id}|`]); let n = d, acc = '';
    parts.forEach(i => { n = n.sous[+i]; acc = acc ? acc + '.' + i : i; c.push([n.nom, `dossier|${d.id}|${acc}`]); }); }
  const L = { 'form-a': 'Créer une Entité A', 'form-b': 'Créer une Entité B', studio: 'Studio de Modèles', magasin: 'Magasin' }; if (L[r.name]) c.push([L[r.name]]);
  return c.map(([l, to], i) => (i ? ic('right', 12) : '') + (i === c.length - 1 ? `<b>${esc(l)}</b>` : `<button ${to.includes('|') ? `data-go="${to}"` : `data-nav="${to}"`}>${esc(l)}</button>`)).join('');
}
function modalHTML() {
  if (!S.modal) return '';
  const backBtn = S.addFinal ? '' : `<button type="button" class="btn" data-act="step|choose">Retour</button>`;
  const b = S.modal === 'choose' ? `<h3>Que voulez-vous ajouter ?</h3><div class="choices">
      <button class="choice" data-act="step|folder">${ic('dossier', 40)}<b>Un dossier</b><small>Vous choisissez son nom</small></button>
      <button class="choice" data-act="step|file">${ic('fichier', 40)}<b>Un fichier</b><small>Depuis un modèle ou un fichier existant</small></button></div>` :
    S.modal === 'folder' ? `<h3>Nouveau dossier</h3><form data-form="newfolder" class="mform"><label for="nf-nom">Nom du dossier<input class="field" id="nf-nom" required placeholder="Sous-dossier C"></label>
      <div class="acts"><button class="btn primary">Créer le dossier</button>${backBtn}</div></form>` :
    `<h3>${S.addFinal ? 'Ajouter la pièce finale' : 'Nouveau fichier'}</h3><p class="mh">Choisir un modèle</p>
      ${MODELS.filter(x => x.actif).map(x => `<button class="opt" data-act="frommodel|${x.id}">${ic('fichier', 20)}<b>${esc(x.nom)}</b><small>${esc(x.theme)}</small></button>`).join('')}
      <button class="opt" data-act="newmodelgo">${ic('plus', 20)}<b>Créer un nouveau modèle</b><small>Ouvre le Studio de Modèles</small></button>
      <p class="mh">Ou un fichier existant</p><button class="opt" data-act="import">${ic('arrow', 20)}<b>Importer un fichier</b><small>Fichier numérisé</small></button>${backBtn ? `<div>${backBtn}</div>` : ''}`;
  return `<div class="scrim" data-act="closemodal"><div class="modal" role="dialog" aria-label="Ajouter au dossier">${b}<button type="button" class="btn ghost" data-act="closemodal" style="align-self:flex-end">Annuler</button></div></div>`;
}
function render(resetScroll) {
  const act = document.activeElement, keep = act && act.id && $('#content').contains(act) ? { id: act.id, pos: act.selectionStart } : null, top = $('#content').scrollTop;
  const m = MODULE[S.route.name];
  $('#side').innerHTML = NAV.map(([id, l, i], n) => (n === 4 ? '<span class="grow"></span><hr>' : '') + `<button class="nav" data-nav="${id}" ${n === m ? 'aria-current="page"' : ''} title="${l}">${ic(i)}<span>${l}</span><span class="n">${n + 1}</span></button>`).join('');
  $('#back').disabled = !S.stack.length; $('#crumbs').innerHTML = crumbs();
  $('#content').innerHTML = `<div class="page">${P[S.route.name]()}</div>`;
  $('#overlay').innerHTML = modalHTML();
  $('#content').scrollTop = resetScroll ? 0 : top;
  if (S.modal === 'folder') { const el = $('#nf-nom'); if (el) el.focus(); }
  else if (S.route.focus) { const el = $('#code-input'); if (el) el.focus(); S.route.focus = false; }
  else if (keep) { const el = document.getElementById(keep.id); if (el) { el.focus(); if (keep.pos != null && el.setSelectionRange) try { el.setSelectionRange(keep.pos, keep.pos); } catch (e) {} } }
}

/* ---------- global search ---------- */
function results(q) {
  const t = q.trim().toLowerCase(), digits = t.replace(/[^0-9]/g, ''); if (!t) return [];
  const hit = x => x.nom.toLowerCase().includes(t) || (digits && x.code && x.code.includes(digits) && /^(code\s*)?#?\d+$/.test(t));
  return [['Entités A', 'a', A.filter(hit).slice(0, 4)], ['Entités B', 'b', B.filter(hit).slice(0, 4)], ['Dossiers', 'd', D.filter(d => d.nom.toLowerCase().includes(t)).slice(0, 4)]].filter(g => g[2].length);
}
function drawSearch() {
  const q = $('#q').value, g = results(q), dd = $('#dd'), flat = g.flatMap(x => x[2].map(it => [x[1], it]));
  if (!q.trim()) { dd.hidden = true; return; }
  const digits = q.replace(/[^0-9]/g, ''), exact = digits.length === 4 ? flat.findIndex(([k, it]) => it.code === digits) : -1;
  if (exact >= 0 && S.siAuto) S.si = exact;
  S.si = Math.max(0, Math.min(S.si, flat.length - 1));
  const mark = s => { const i = s.toLowerCase().indexOf(q.trim().toLowerCase()); return i < 0 ? esc(s) : esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + q.trim().length)) + '</mark>' + esc(s.slice(i + q.trim().length)); };
  let n = -1;
  dd.innerHTML = `<div class="info">${flat.length ? `Résultats pour « ${esc(q.trim())} »${exact >= 0 ? ' · code exact : Entrée ouvre la fiche' : ''}` : `Aucun résultat pour « ${esc(q.trim())} ». Essayez un nom ou un code à 4 chiffres.`}</div>` +
    g.map(([label, k, items]) => `<div class="grp"><h4>${label} · ${items.length}</h4>${items.map(it => { n++; return `<button class="res${n === S.si ? ' on' : ''}" data-res="${n}">${ic(k === 'd' ? 'dossier' : k)}<b>${mark(it.nom)}</b>${k === 'd' ? `<span>${esc(it.theme)} · Année ${it.annee}</span><span class="sp"></span>${badge(it.statut)}` : `<span class="sp"></span>${codeOf(it)}`}</button>`; }).join('')}</div>`).join('') +
    (flat.length ? `<div class="foot"><span><span class="kbd">↑</span><span class="kbd">↓</span>Naviguer</span><span><span class="kbd">Entrée</span>Ouvrir la fiche</span><span><span class="kbd">Échap</span>Fermer</span></div>` : '');
  dd.hidden = false; S.flat = flat;
}
function openResult(i) { const r = S.flat && S.flat[i]; if (!r) return; $('#q').value = ''; $('#dd').hidden = true; $('#q').blur(); go(r[0] === 'd' ? { name: 'dossier', id: r[1].id, path: '' } : { name: 'fiche-' + r[0], id: r[1].id }); }

/* ---------- actions ---------- */
const addFile = src => { const r = S.route, d = byId(D, r.id), n = node(d, r.path), m = MODELS.find(x => x.nom === src);
  const f = { nom: 'Document_' + pad(nFiles(d) + 1), src, date: today(), blocs: m ? fromModel(m) : null }; n.files.push(f); r.file = f.nom;
  if (S.addFinal && d.statut === 'piece') d.statut = 'cours'; S.addFinal = false; S.modal = null; };
const newModel = () => { const c = { id: 'm' + (MODELS.length + 1), nom: 'Modèle ' + pad(MODELS.length + 1), theme: THEMES[0].nom, actif: true, blocs: [] }; MODELS.push(c); S.model = c.id; };
const DEF = { texte: 'Texte libre du modèle.', champ: 'Libellé du champ', variable: 'Entité A · Nom', case: 'Option à cocher', magasin: 'Choix dans le Magasin' };
const ACT = {
  back, inv: v => S.inv = v, tab: v => S.tab = +v, noid: k => S.f[k].noid = !S.f[k].noid, view: v => S.f.d.view = v,
  tog: key => S.open.has(key) ? S.open.delete(key) : S.open.add(key),
  arch: (k, id) => { const x = byId(list(k), id); x.actif = !x.actif; },
  pick: nom => S.route.file = nom, add: () => S.modal = 'choose', step: v => S.modal = v, closemodal: () => { S.modal = null; S.addFinal = false; },
  final: () => { S.addFinal = true; S.modal = 'file'; }, import: () => addFile('Fichier importé'), frommodel: id => addFile(byId(MODELS, id).nom),
  newmodelgo: () => { newModel(); S.addFinal = false; go({ name: 'studio' }); },
  clore: id => byId(D, id).statut = 'clos', reopen: id => byId(D, id).statut = 'cours',
  model: id => S.model = id, addblk: t => byId(MODELS, S.model).blocs.push({ t, v: DEF[t] }), rmblk: i => byId(MODELS, S.model).blocs.splice(+i, 1),
  dup: id => { const m = byId(MODELS, id), c = { ...m, id: 'm' + (MODELS.length + 1), nom: m.nom + ' (copie)', actif: true, blocs: m.blocs.map(b => ({ ...b })) }; MODELS.push(c); S.model = c.id; },
  archmodel: id => { const m = byId(MODELS, id); m.actif = !m.actif; }, newmodel: newModel,
  magarch: i => MAGASIN[+i].actif = !MAGASIN[+i].actif,
  theme: v => { if (v === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = v; },
  dens: v => { if (v === 'eq') delete document.documentElement.dataset.density; else document.documentElement.dataset.density = v; },
  tharch: i => THEMES[+i].actif = !THEMES[+i].actif,
};
document.addEventListener('click', e => {
  const t = e.target;
  const res = t.closest('[data-res]'); if (res) return openResult(+res.dataset.res);
  if (!t.closest('#search')) $('#dd').hidden = true;
  const nav = t.closest('[data-nav]'); if (nav) return root(nav.dataset.nav);
  const g = t.closest('[data-go]'); if (g) { const [name, id, p, file] = g.dataset.go.split('|'); return go(name === 'dossier' ? { name, id, path: p || '', file } : { name, id, focus: p === 'code' }); }
  const a = t.closest('[data-act]');
  if (a) { if (a.classList.contains('scrim') && t.closest('.modal')) return; const [name, ...args] = a.dataset.act.split('|'); ACT[name](...args); if (name !== 'back' && name !== 'newmodelgo') render(); }
});
document.addEventListener('change', e => { const t = e.target;
  if (t.dataset.f) { const [k, p] = t.dataset.f.split('.'); S.f[k][p] = t.value; render(); }
  else if (t.dataset.m) { byId(MODELS, S.model)[t.dataset.m] = t.value; render(); }
  else if (t.dataset.blk && t.tagName === 'SELECT') { byId(MODELS, S.model).blocs[+t.dataset.blk].v = t.value; render(); }
  else if (t.dataset.doc === 'date') { if (t.value) { curFile().date = t.value; render(); } }
  else if (t.dataset.db) { const b = curFile().blocs[+t.dataset.db]; if (t.type === 'checkbox') b.ok = t.checked; else b.val = t.value; }
  else if (t.dataset.check) { byId(D, S.route.id).checks[+t.dataset.check].ok = t.checked; render(); } });
document.addEventListener('input', e => { const t = e.target;
  if (t.id === 'q') { S.si = 0; S.siAuto = true; drawSearch(); }
  else if (t.id === 'f-b-code') { S.f.b.code = t.value; render(); }
  else if (t.dataset.m === 'nom') { byId(MODELS, S.model).nom = t.value; render(); }
  else if (t.dataset.blk && t.tagName !== 'SELECT') { byId(MODELS, S.model).blocs[+t.dataset.blk].v = t.value; render(); }
  else if (t.dataset.db && t.type !== 'checkbox' && t.tagName !== 'SELECT') curFile().blocs[+t.dataset.db].val = t.value;
  else if (t.id === 'code-input' || t.id === 'n-code') t.value = t.value.replace(/\D/g, ''); });
document.addEventListener('submit', e => { e.preventDefault(); const [kind, k, id] = e.target.dataset.form.split('|'), val = s => $(s).value.trim();
  if (kind === 'code') { const v = $('#code-input').value; if (v.length !== 4) return $('#code-input').focus(); byId(list(k), id).code = v; render(); }
  if (kind === 'create') { const L = list(k), code = $('#n-code').value, x = { id: k + (L.length + 1), nom: val('#n-nom'), code: code.length === 4 ? code : null, cat: $('#n-cat').value, actif: true, annee: 2025 }; if (!x.nom) return; L.push(x); S.stack = [{ name: 'rep-' + k }]; S.route = { name: 'fiche-' + k, id: x.id }; render(true); }
  if (kind === 'theme' && val('#th-new')) { THEMES.push({ nom: val('#th-new'), actif: true }); render(); }
  if (kind === 'magasin' && val('#mg-new')) { MAGASIN.push({ nom: val('#mg-new'), actif: true }); render(); $('#mg-new').focus(); }
  if (kind === 'check' && val('#ck-new')) { byId(D, S.route.id).checks.push({ nom: val('#ck-new'), ok: false }); render(); }
  if (kind === 'newfolder' && val('#nf-nom')) { node(byId(D, S.route.id), S.route.path).sous.push({ nom: val('#nf-nom'), sous: [], files: [] }); S.modal = null; render(); } });
$('#q').addEventListener('focus', drawSearch);
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#q').focus(); $('#q').select(); return; }
  if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); return back(); }
  if (e.key === 'Escape') { if (S.modal) { S.modal = null; S.addFinal = false; render(); } $('#dd').hidden = true; if (document.activeElement === $('#q')) $('#q').blur(); return; }
  if (document.activeElement === $('#q') && !$('#dd').hidden) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); S.siAuto = false; S.si += e.key === 'ArrowDown' ? 1 : -1; drawSearch(); }
    if (e.key === 'Enter') { e.preventDefault(); openResult(S.si); } return; }
  if (e.key === 'Enter' && document.activeElement.matches && document.activeElement.matches('tr[data-go]')) document.activeElement.click();
});
$('#back').innerHTML = ic('back') + '<span class="backl">Retour</span>'; $('#q-ic').innerHTML = ic('search');
$('#c1').innerHTML = ic('min', 12); $('#c2').innerHTML = ic('max', 12); $('#c3').innerHTML = ic('close', 12);
render(true);
</script>
